{% load i18n %}
<input type="{{ widget.type }}" name="{{ widget.name }}" {% if widget.value %}checked{% endif %}{% for name, value in widget.attrs.items %} {{ name }}="{{ value }}"{% endfor %}>
<label for="{{ widget.attrs.id }}" class="checkbox">✓</label>
<label for="{{ widget.attrs.id }}" class="link">
  {% autoescape off %}
    {% trans label_text %}
  {% endautoescape %}
</label>
