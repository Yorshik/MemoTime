[project]
name = "memotime"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black==24.8.0",
    "celery==5.4.0",
    "coverage==7.6.4",
    "django==4.2.16",
    "django-betterforms==2.0.0",
    "django-celery-beat>=2.7.0",
    "django-celery-results==2.5.1",
    "django-debug-toolbar==4.4.6",
    "django-ipware==7.0.1",
    "django-ratelimit==4.1.0",
    "django-redis==5.4.0",
    "django-simple-captcha==0.6.0",
    "flake8==7.1.1",
    "flake8-absolute-import==1.0.0.2",
    "flake8-bugbear==24.10.31",
    "flake8-builtins==2.5.0",
    "flake8-clean-block==0.1.2",
    "flake8-commas==4.0.0",
    "flake8-comments==0.1.2",
    "flake8-comprehensions==3.15.0",
    "flake8-dunder-all==0.4.1",
    "flake8-eradicate==1.5.0",
    "flake8-expression-complexity==0.0.11",
    "flake8-forbidden-func==0.1.0",
    "flake8-import-order==0.18.2",
    "flake8-print==5.0.0",
    "flake8-pyproject==1.2.3",
    "flake8-quotes==3.4.0",
    "flake8-return==1.2.0",
    "flake8-simplify==0.2.0",
    "flake8-use-pathlib==0.3.0",
    "gevent==24.11.1",
    "gunicorn==23.0.0",
    "isort==5.13.2",
    "parametrize==0.1.1",
    "pep8-naming==0.14.1",
    "pillow==10.4.0",
    "psycopg2-binary==2.9.9",
    "pyjwt==2.10.1",
    "python-decouple==3.8",
    "pytz==2024.2",
    "redis==5.2.1",
    "sort-requirements==1.3.0",
]

[tool.black]
line-length = 88
target-version = ['py310']
preview = true
enable-unstable-feature = ["string_processing"]

[tool.isort]
profile = "black"
line_length = 88
known_third_party = ["django"]
known_first_party = ["apps.core", "apps.homepage", "apps.feedback", "apps.schedule", "apps.users"]
default_section = "THIRDPARTY"
force_sort_within_sections = true
combine_as_imports = true
